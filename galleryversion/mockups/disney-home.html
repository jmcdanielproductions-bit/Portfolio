<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disney+ Home — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080B12;--bg-2:#0C1019;--ink:#EAF0F6;--muted:rgba(234,240,246,.64);--faint:rgba(234,240,246,.36);
    --line:rgba(234,240,246,.10);--blue:#5C86AD;--blue-soft:rgba(92,134,173,.18);--blue-line:rgba(92,134,173,.5);--gold:#D6B77A;
    --ease-settle:cubic-bezier(0.16,1,0.3,1);--ease-enter:cubic-bezier(0.22,1,0.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .mono{font-family:"JetBrains Mono",monospace}
  /* nav */
  .nav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
    padding:1rem clamp(1.2rem,3vw,2.6rem);transition:background .4s var(--ease-settle),backdrop-filter .4s;}
  .nav.scrolled{background:rgba(8,11,18,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{font-family:"Anton",sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:1.15rem}
  .brand span{color:var(--blue)}
  .navlinks{display:flex;gap:1.5rem;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .navlinks a{color:inherit;text-decoration:none;transition:color .3s var(--ease-settle)}
  .navlinks a:hover,.navlinks a.on{color:var(--ink)}
  /* tilt-shift depth bands: fixed, graduated blur at top/bottom edges only.
     Smaller + lighter than a naive version, and DROPPED ENTIRELY (not just
     visually hidden) during active scroll and while a row is ambiently
     drifting under the bottom band — those are the two things that would
     otherwise force per-frame backdrop-filter resampling. */
  .tilt-band{position:fixed;left:0;right:0;z-index:35;pointer-events:none;
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    transition:opacity .25s linear}
  .tilt-band.top{top:0;height:10vh;
    -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.8) 0%,transparent 100%);
    mask-image:linear-gradient(to bottom,rgba(0,0,0,.8) 0%,transparent 100%)}
  .tilt-band.bottom{bottom:0;height:12vh;
    -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.8) 0%,transparent 100%);
    mask-image:linear-gradient(to top,rgba(0,0,0,.8) 0%,transparent 100%)}
  html.is-scrolling .tilt-band{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;opacity:0}
  @media(max-width:768px),(prefers-reduced-motion:reduce){.tilt-band{display:none}}
  /* hero */
  .hero{position:relative;height:82vh;min-height:520px;overflow:hidden}
  .hero-bg-stack{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
  .hero-slide{position:absolute;inset:0;opacity:0;filter:blur(26px) saturate(1.15);transform:scale(1.09);
    transition:opacity 1.7s var(--ease-settle),filter 1.7s var(--ease-settle),transform 1.7s var(--ease-settle);
    will-change:opacity,filter,transform}
  .hero-slide.on{opacity:1;filter:blur(0) saturate(1);transform:scale(1)}
  .hero-slide img,.hero-slide video{position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:center 30%;display:block;transform-origin:center;backface-visibility:hidden}
  @keyframes heroKenBurns{from{transform:scale(1)}to{transform:scale(1.08)}}
  @media(prefers-reduced-motion:reduce){.hero-slide{transition:opacity .4s linear!important;filter:none!important;transform:none!important}}
  .hero::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(90deg,rgba(8,11,18,.96) 0%,rgba(8,11,18,.7) 32%,transparent 62%),
      linear-gradient(0deg,var(--bg) 2%,transparent 40%)}
  .hero-inner{position:absolute;z-index:3;left:clamp(1.2rem,3vw,2.6rem);bottom:clamp(2.5rem,7vh,5rem);max-width:640px}
  .hkick{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--blue);margin-bottom:.5rem}
  .htitle{font-family:"Anton",sans-serif;text-transform:uppercase;line-height:.92;font-size:clamp(2.8rem,7vw,6rem);letter-spacing:.03em;word-spacing:.12em}
  .hmeta{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin:.9rem 0 0;font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .hmeta .pill{border:1px solid var(--line);border-radius:20px;padding:.2rem .7rem}
  .hlede{color:var(--muted);font-weight:300;font-size:clamp(.95rem,1.6vw,1.15rem);margin-top:.9rem;max-width:48ch;line-height:1.6}
  .hbtns{display:flex;gap:.8rem;margin-top:1.4rem;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:.55rem;padding:.75rem 1.4rem;border-radius:40px;cursor:pointer;
    font:inherit;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border:1px solid transparent;transition:all .35s var(--ease-settle)}
  .btn.play{background:var(--ink);color:#0a0d14}.btn.play:hover{transform:translateY(-2px)}
  .btn.info{background:rgba(234,240,246,.08);color:var(--ink);border-color:var(--line)}
  .btn.info:hover{background:rgba(234,240,246,.16);transform:translateY(-2px)}
  .hdots{position:absolute;z-index:3;right:clamp(1.2rem,3vw,2.6rem);bottom:clamp(2.5rem,7vh,5rem);display:flex;gap:8px}
  .hdots button{width:8px;height:8px;border-radius:50%;border:none;background:rgba(234,240,246,.3);cursor:pointer;transition:all .3s var(--ease-settle);padding:0}
  .hdots button.on{background:var(--blue);width:22px;border-radius:5px}
  /* rows */
  .rows{position:relative;z-index:5;margin-top:-3vh;padding-bottom:4rem}
  .row{margin:2.2rem 0}
  .row h2{font-family:"Space Grotesk";font-weight:500;font-size:1.05rem;letter-spacing:.02em;color:var(--ink);
    margin:0 clamp(1.2rem,3vw,2.6rem) .8rem;display:flex;align-items:center;gap:.6rem}
  .row h2 .ct{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
  .trackwrap{position:relative}
  .track{position:relative;overflow:hidden;padding:.9rem clamp(1.2rem,3vw,2.6rem) 1.4rem;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 32px,#000 calc(100% - 72px),transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 32px,#000 calc(100% - 72px),transparent 100%)}
  /* .reel holds two back-to-back copies of the row; a slow rAF-driven
     translateX creates an endless drift. transform-only, GPU-composited,
     paused whenever the row is hovered/focused, off-screen, hidden, or
     prefers-reduced-motion. */
  .reel{display:flex;gap:12px;will-change:transform}
  .rownav{position:absolute;top:0;bottom:1.4rem;width:64px;display:grid;place-items:center;border:none;cursor:pointer;z-index:8;
    color:var(--ink);font-size:22px;opacity:0;transition:opacity .3s var(--ease-settle);padding:0}
  .trackwrap:hover .rownav{opacity:.9}.rownav:hover{opacity:1!important}
  .rownav.prev{left:0;background:linear-gradient(90deg,rgba(8,11,18,.9),rgba(8,11,18,0))}
  .rownav.next{right:0;background:linear-gradient(270deg,rgba(8,11,18,.9),rgba(8,11,18,0))}
  .rownav span{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:rgba(20,26,38,.7);border:1px solid var(--line)}
  .card{flex:none;width:266px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;position:relative;cursor:pointer;
    background:var(--bg-2);border:1px solid var(--line);
    transition:transform .4s var(--ease-settle),border-color .4s var(--ease-settle),box-shadow .4s var(--ease-settle)}
  .card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease-settle),opacity .3s ease}
  .card:hover{transform:translateY(-6px) scale(1.03);border-color:var(--blue-line);box-shadow:0 14px 34px rgba(0,0,0,.5);z-index:2}
  .card:hover img{transform:scale(1.06)}
  .card.previewing img{opacity:0}
  .card .prevvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
    transition:opacity .35s ease;pointer-events:none}
  .card .prevvid.on{opacity:1}
  .card .cover{position:absolute;inset:0;background:linear-gradient(0deg,rgba(6,9,15,.92),transparent 62%);
    opacity:0;transition:opacity .4s var(--ease-settle);display:flex;flex-direction:column;justify-content:flex-end;padding:.7rem .8rem}
  .card:hover .cover{opacity:1}
  .card .cc{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.14em;color:var(--blue)}
  .card .ctt{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:1.05rem;line-height:1;margin-top:.15rem;letter-spacing:.02em;word-spacing:.08em}
  .card .cm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:.2rem}
  .card .play-i{position:absolute;top:.6rem;right:.6rem;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    background:rgba(8,11,18,.6);border:1px solid var(--line);font-size:11px;opacity:0;transform:scale(.7);transition:all .4s var(--ease-enter)}
  .card:hover .play-i{opacity:1;transform:scale(1)}
  .badge{position:absolute;top:.6rem;left:.6rem;font-family:"JetBrains Mono",monospace;font-size:8px;letter-spacing:.06em;
    background:rgba(214,183,122,.2);color:var(--gold);padding:2px 6px;border-radius:4px}
  /* first-scroll reveal: cards converge toward the row's center + rise + fade.
     transform/opacity only, one-time per row, stagger via inline transition-delay.
     --rx (per-card horizontal offset) is set inline in JS. */
  .card.reveal{opacity:0;transform:translate(var(--rx,0),46px) scale(.94);
    transition:opacity .7s var(--ease-enter),transform .7s var(--ease-enter)}
  .row.revealed .card.reveal{opacity:1;transform:translate(0,0) scale(1)}
  .row.revealed .card.reveal:hover{transform:translateY(-6px) scale(1.03)}
  /* glide-to-center detail */
  .scrim{position:fixed;inset:0;z-index:60;background:rgba(6,9,15,.55);opacity:0;pointer-events:none;
    transition:opacity .45s var(--ease-settle);backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px)}
  .scrim.on{opacity:1;pointer-events:auto;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .detail{position:fixed;z-index:61;top:50%;left:50%;width:min(60vw,760px);
    transform:translate(-50%,-50%);transform-origin:center;
    background:var(--bg-2);border:1px solid var(--blue-line);border-radius:16px;overflow:hidden;
    opacity:0;pointer-events:none;box-shadow:0 40px 120px rgba(0,0,0,.7)}
  .detail.on{opacity:1;pointer-events:auto}
  .detail .dimg{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
  .detail .dbody{padding:1.3rem clamp(1.2rem,2.5vw,1.8rem) 1.5rem}
  .detail .dcode{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;color:var(--blue)}
  .detail .dtitle{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:clamp(1.8rem,4vw,3rem);line-height:.98;margin:.15rem 0 .5rem;letter-spacing:.02em;word-spacing:.1em}
  .detail .dmeta{display:flex;gap:1.5rem;flex-wrap:wrap;margin:.5rem 0 1rem}
  .detail .dmeta .k{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
  .detail .dmeta div{font-size:13px}
  .detail .dbtns{display:flex;gap:.7rem;flex-wrap:wrap}
  .dclose{position:absolute;top:.7rem;right:.7rem;z-index:2;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
    background:rgba(8,11,18,.65);color:var(--ink);cursor:pointer;font-size:15px;display:grid;place-items:center}
  .foot{border-top:1px solid var(--line);margin-top:2rem;padding:1.4rem clamp(1.2rem,3vw,2.6rem);
    color:var(--faint);font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.scrim.on{backdrop-filter:none}}
  @media(max-width:640px){.detail{width:92vw}.card{width:210px}}
</style>
</head>

<script>
const P=[
 {c:"—",t:"Director Reel",yt:"mFeMMMmdW24",client:"Jared McDaniel",type:"Overview Reel",year:"2026",f:["Featured"],lede:"The fastest overview — campaigns, trailers, and brand films in one cinematic cut.",dossier:1,loop:"../videos/loops/reel-loop.mp4"},
 {c:"T1/01",t:"Cyberpunk 2077",yt:"Hc_t2eTorhI",client:"CD Projekt Red",type:"Campaign Trailer",year:"2025",f:["Featured","Gaming","Trailer"],lede:"Campaign direction for the world of Cyberpunk — neon pressure, urban speed, aggressive visual energy.",dossier:1,loop:"../videos/loops/cyberpunk-loop.mp4"},
 {c:"T1/02",t:"DOOM",yt:"0WUnGHJXeHc",client:"Bethesda",type:"Game Trailer",year:"2025",f:["Featured","Gaming","Trailer"],lede:"Impact-forward editorial rhythm built around speed, weight, and release energy.",dossier:1,loop:"../videos/loops/doom-loop.mp4"},
 {c:"T1/03",t:"Fallout / Nuka-Cola",yt:"VxTBnNhAD3Q",client:"Bethesda",type:"Commercial Spot",year:"2025",f:["Featured","Commercial"],lede:"Brand-world spot with playful apocalyptic texture and campaign utility.",dossier:1,loop:"../videos/loops/fallout-loop.mp4"},
 {c:"T1/04",t:"The Witcher",yt:"tr1ajPqpuDs",client:"CD Projekt Red",type:"Cinematic Trailer",year:"2025",f:["Featured","Gaming","Trailer","Narrative"],lede:"Cinematic fantasy cut built around atmosphere, character, and scale.",dossier:1,loop:"../videos/loops/witcher-loop.mp4"},
 {c:"T2/05",t:"Product Experience",yt:"OZZsRSgG70g",client:"Corsair",type:"Product Film",year:"2024",f:["Commercial"],lede:"Product-forward commercial edit with tactile pacing and clean motion language."},
 {c:"T2/06",t:"Invincible Novablade Pro",yt:"WcOLQd3IycM",client:"CORSAIR",type:"Product Campaign",year:"2025",f:["Commercial","Gaming"],lede:"Product campaign built around performance texture and launch-ready brand energy.",loop:"../videos/loops/novablade-loop.mp4"},
 {c:"T2/08",t:"Prime Gaming Week",yt:"x5VkzsCT6eA",client:"CORSAIR",type:"Retail Campaign",year:"2025",f:["Commercial","Gaming"],lede:"Promotional campaign cut for a gaming-focused retail moment.",loop:"../videos/loops/primeweek-loop.mp4"},
 {c:"T2/10",t:"BMW Fanatec AD",yt:"stQ7DVL4PvE",client:"BMW / Fanatec",type:"Commercial Spot",year:"2025",f:["Commercial","Gaming"],lede:"Motorsport brand spot combining performance language with sim-racing precision.",loop:"../videos/loops/bmw-loop.mp4"},
 {c:"T2/11",t:"Experience Store",yt:"1MzUb4VSi1s",client:"CORSAIR",type:"Brand Film",year:"2025",f:["Commercial"],views:"134K",lede:"Retail experience film capturing the energy and craft of the CORSAIR flagship store."},
 {c:"T3/11",t:"Frame Cut",yt:"nAIy3q5myjY",client:"Personal",type:"Editorial Feature",year:"2024",f:["Editorial"],lede:"Music-led editorial exercise focused on rhythm, contrast, and visual release.",loop:"../videos/loops/framecut-loop.mp4"},
 {c:"T3/12",t:"Flow Edit — Lil Baby",yt:"DvQ-cIp07Mg",client:"Personal",type:"Editorial Feature",year:"2025",f:["Editorial"],lede:"Rhythm study built around flow, impact cuts, and performance-driven motion.",loop:"../videos/loops/lilbaby-loop.mp4"},

 {c:"T3/14",t:"Luffy — Edit",yt:"KAl31zPic9Y",client:"Personal",type:"Editorial Feature",year:"2025",f:["Editorial"],lede:"Edit built around character energy, punchy rhythm, and visual momentum.",loop:"../videos/loops/luffy-loop.mp4"},
 {c:"T4/15",t:"Ashfall",yt:"Nf_lDTJCl2w",client:"Independent",type:"Narrative Short",year:"2024",f:["Narrative"],lede:"Narrative atmosphere piece with restrained pacing and cinematic texture."},
 {c:"T4/16",t:"Kairi & Pixel",yt:"mpTbAcvWflA",client:"CORSAIR",type:"Holiday Animation",year:"2025",f:["Featured","Commercial","Narrative"],views:"70K",lede:"CORSAIR holiday animation campaign built around new brand characters with Pixune Studios.",dossier:1,loop:"../videos/loops/kairi-loop.mp4"},
 {c:"T4/17",t:"Shugo Samurai",yt:"Lpeyg7lq_DY",client:"Shugo Samurai",type:"Trailer",year:"2025",f:["Commercial","Gaming","Trailer","Narrative"],views:"100K",lede:"Trailer direction with character-forward action, atmosphere, and campaign energy.",loop:"../videos/loops/shugo-loop.mp4"},
 {c:"T4/18",t:"Silent Collapse",yt:"Yj2ncYs0vGU",client:"Independent",type:"Experimental Short",year:"2024",f:["Narrative"],lede:"Mood-forward short edit with minimal structure and escalating visual tension."}
];
const maxres=id=>`https://img.youtube.com/vi/${id}/maxresdefault.jpg`;
const hq=id=>`https://img.youtube.com/vi/${id}/hqdefault.jpg`;
const has=(p,tag)=>p.f.includes(tag);
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const ROWS=[
 {label:"Start here",code:"Featured",items:P.filter(p=>has(p,"Featured"))},
 {label:"Campaigns & trailers",code:"Gaming · Trailer",items:P.filter(p=>has(p,"Trailer")||has(p,"Gaming"))},
 {label:"Commercial & brand",code:"Commercial",items:P.filter(p=>has(p,"Commercial"))},
 {label:"Editorial & edits",code:"Personal",items:P.filter(p=>has(p,"Editorial"))},
 {label:"Narrative & short films",code:"Narrative",items:P.filter(p=>has(p,"Narrative"))}
];

/* ---- rows: endless ambient drift + single-budget hover video preview ---- */
const coarsePointer=matchMedia('(hover:none),(pointer:coarse)').matches;
const ambientOff=reduced||matchMedia('(max-width:768px)').matches;
const MARQUEE_SPEED=24; /* px/sec — deliberately slow, a hint of motion not a ticker */
const marqueeRows=[];
let marqueeRAF=null,marqueeLast=null;
let activePreview=null; /* {card,video} — only one preview video decodes at a time */
let modalOpen=false;

/* Freeze all ambient motion (marquee + tilt-band blur) while the page is
   actively scrolling — the highest-load moment, and the one time the drift
   is least perceptible anyway. Resumes ~160ms after scroll settles. */
let isScrolling=false,scrollIdleTimer=null;
addEventListener('scroll',()=>{
  if(!isScrolling){isScrolling=true;document.documentElement.classList.add('is-scrolling');}
  clearTimeout(scrollIdleTimer);
  scrollIdleTimer=setTimeout(()=>{
    isScrolling=false;document.documentElement.classList.remove('is-scrolling');kickMarquee();
  },160);
},{passive:true});

function startPreview(card,p){
  if(coarsePointer||reduced||!p.loop)return;
  if(activePreview)stopPreview(activePreview.card);
  const v=document.createElement('video');
  v.className='prevvid';v.muted=true;v.loop=true;v.playsInline=true;v.preload='auto';
  v.addEventListener('canplay',()=>{v.classList.add('on');card.classList.add('previewing');});
  v.addEventListener('error',()=>{v.remove();});
  v.src=p.loop;
  card.appendChild(v);
  v.play().catch(()=>{});
  activePreview={card,video:v};
}
function stopPreview(card){
  if(activePreview&&activePreview.card===card){
    activePreview.video.pause();activePreview.video.remove();
    card.classList.remove('previewing');
    activePreview=null;
  }
}

function buildCard(p){
  const card=document.createElement('button');card.className='card';
  const img=new Image();img.src=maxres(p.yt);img.alt=p.t;img.loading='lazy';
  img.onerror=()=>{img.onerror=null;img.src=hq(p.yt);};
  card.appendChild(img);
  card.insertAdjacentHTML('beforeend',
    (p.views?`<span class="badge">${p.views} views</span>`:'')+
    `<span class="play-i">▶</span>`+
    `<div class="cover"><div class="cc">${p.c}</div><div class="ctt">${p.t}</div><div class="cm">${p.client} · ${p.type}</div></div>`);
  card.addEventListener('click',()=>openDetail(card,p));
  if(p.loop&&!coarsePointer){
    let hoverTimer=null;
    card.addEventListener('pointerenter',()=>{clearTimeout(hoverTimer);hoverTimer=setTimeout(()=>startPreview(card,p),380);});
    card.addEventListener('pointerleave',()=>{clearTimeout(hoverTimer);stopPreview(card);});
  }
  return card;
}

const rowsEl=document.getElementById('rows');
ROWS.forEach((r,rowIndex)=>{
  const sec=document.createElement('div');sec.className='row';
  sec.innerHTML=`<h2>${r.label} <span class="ct">${r.items.length} titles</span></h2>`;
  const wrap=document.createElement('div');wrap.className='trackwrap';
  const track=document.createElement('div');track.className='track';
  const reel=document.createElement('div');reel.className='reel';
  /* First-scroll reveal: only the first-pass cards (the ones visible at
     rest) get the entrance treatment — the duplicated set behind them in
     the loop never needs one, it only appears via ambient drift. */
  const firstSet=r.items.map(p=>buildCard(p));
  const n=firstSet.length,center=(n-1)/2;
  firstSet.forEach((card,i)=>{
    card.classList.add('reveal');
    const rx=Math.max(-130,Math.min(130,Math.round((center-i)*22)));
    card.style.setProperty('--rx',rx+'px');
    card.style.transitionDelay=Math.min(Math.abs(i-center)*45,380)+'ms';
    reel.appendChild(card);
  });
  track.appendChild(reel);
  const prev=document.createElement('button');prev.className='rownav prev';prev.setAttribute('aria-label','Scroll left');prev.innerHTML='<span>❮</span>';
  const next=document.createElement('button');next.className='rownav next';next.setAttribute('aria-label','Scroll right');next.innerHTML='<span>❯</span>';
  wrap.appendChild(track);wrap.appendChild(prev);wrap.appendChild(next);
  sec.appendChild(wrap);rowsEl.appendChild(sec);

  const state={reel,wrap,pos:0,dir:rowIndex%2===0?1:-1,setWidth:0,paused:false,visible:false,revealed:false};
  marqueeRows.push(state);
  requestAnimationFrame(()=>{
    state.setWidth=reel.scrollWidth+12; /* +gap so the seam lands cleanly */
    r.items.forEach(p=>reel.appendChild(buildCard(p))); /* second copy for the seamless loop */
    const io=new IntersectionObserver(([e])=>{
      state.visible=e.isIntersecting;
      if(state.visible){
        kickMarquee();
        if(!state.revealed){state.revealed=true;sec.classList.add('revealed');}
      }
    },{threshold:0.1});
    io.observe(wrap);
  });
  const nudge=(dir)=>{state.pos=((state.pos+dir*280)%state.setWidth+state.setWidth)%state.setWidth;applyReel(state);};
  prev.onclick=()=>nudge(-state.dir);
  next.onclick=()=>nudge(state.dir);
  wrap.addEventListener('pointerenter',()=>{state.paused=true;});
  wrap.addEventListener('pointerleave',()=>{state.paused=false;kickMarquee();});
  wrap.addEventListener('focusin',()=>{state.paused=true;});
  wrap.addEventListener('focusout',()=>{state.paused=false;kickMarquee();});
});

function applyReel(state){
  const tx=state.dir===1?-state.pos:(-state.setWidth+state.pos);
  state.reel.style.transform=`translate3d(${tx.toFixed(1)}px,0,0)`;
}
function marqueeTick(ts){
  if(marqueeLast===null)marqueeLast=ts;
  const dt=Math.min(64,ts-marqueeLast);marqueeLast=ts;
  let anyActive=false;
  if(!isScrolling&&!modalOpen){
    marqueeRows.forEach(state=>{
      if(state.paused||!state.visible||!state.setWidth)return;
      anyActive=true;
      state.pos=(state.pos+MARQUEE_SPEED*dt/1000)%state.setWidth;
      applyReel(state);
    });
  }
  if(anyActive&&!document.hidden){marqueeRAF=requestAnimationFrame(marqueeTick);}
  else{marqueeRAF=null;marqueeLast=null;}
}
function kickMarquee(){if(!marqueeRAF&&!ambientOff&&!document.hidden&&!isScrolling&&!modalOpen){marqueeRAF=requestAnimationFrame(marqueeTick);}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)kickMarquee();});

document.getElementById('foot').textContent='PROTOTYPE · Disney+ home · '+P.length+' films + reel · real YouTube stills · loop-video hover previews · first-scroll reveal per row · ambient drift freezes during scroll, modal, hover/focus, off-screen, hidden tab, reduced-motion · tilt-shift bands drop entirely while scrolling';

/* ---- hero rotator: dual-layer cross-blur dissolve, video-first ---- */
const FEAT=P.filter(p=>has(p,"Featured"));
const hdots=document.getElementById('hdots');
const heroSlides=[document.getElementById('heroSlideA'),document.getElementById('heroSlideB')];
const ROTATE_MS=9000, TRANSITION_MS=1700;
let hi=0,htimer,slideTurn=0;
FEAT.forEach((p,i)=>{const b=document.createElement('button');b.addEventListener('click',()=>{setHero(i);rotate();});hdots.appendChild(b);});

function fillSlide(el,p){
  el.innerHTML='';
  if(p.loop){
    const v=document.createElement('video');
    v.muted=true;v.loop=true;v.playsInline=true;v.preload='auto';
    v.poster=maxres(p.yt);
    v.addEventListener('error',()=>{
      if(el.dataset.fellBack)return; el.dataset.fellBack='1';
      const img=new Image();img.src=maxres(p.yt);img.alt=p.t;
      img.onerror=()=>{img.onerror=null;img.src=hq(p.yt);};
      el.innerHTML='';el.appendChild(img);
    },{once:true});
    v.src=p.loop;
    el.appendChild(v);
    if(!reduced){v.play().catch(()=>{});}
    if(!reduced){v.style.animation=`heroKenBurns ${(ROTATE_MS+TRANSITION_MS)/1000}s linear forwards`;}
  }else{
    const img=new Image();img.src=maxres(p.yt);img.alt=p.t;
    img.onerror=()=>{img.onerror=null;img.src=hq(p.yt);};
    el.appendChild(img);
    if(!reduced){img.style.animation=`heroKenBurns ${(ROTATE_MS+TRANSITION_MS)/1000}s linear forwards`;}
  }
}
function setHero(i){
  hi=i;const p=FEAT[i];
  const incoming=heroSlides[slideTurn%2], outgoing=heroSlides[(slideTurn+1)%2];
  slideTurn++;
  fillSlide(incoming,p);
  incoming.classList.remove('on');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    incoming.classList.add('on');
    outgoing.classList.remove('on');
    const outMedia=outgoing.querySelector('video');
    if(outMedia)setTimeout(()=>{if(!outgoing.classList.contains('on'))outMedia.pause();},TRANSITION_MS+80);
  }));
  document.getElementById('hkick').textContent=has(p,"Featured")&&p.c==="—"?"Featured · Start here":"Featured";
  document.getElementById('htitle').textContent=p.t;
  document.getElementById('hmeta').innerHTML=`<span class="pill">${p.year}</span><span class="pill">${p.type}</span><span>${p.client}</span>`;
  document.getElementById('hlede').textContent=p.lede||'';
  [...hdots.children].forEach((d,n)=>d.classList.toggle('on',n===i));
  document.getElementById('hplay').onclick=()=>openDetail(null,p);
  document.getElementById('hinfo').onclick=()=>openDetail(null,p);
}
function rotate(){clearInterval(htimer);htimer=setInterval(()=>setHero((hi+1)%FEAT.length),ROTATE_MS);}
setHero(0);rotate();

/* ---- nav scroll ---- */
const nav=document.getElementById('nav');
addEventListener('scroll',()=>nav.classList.toggle('scrolled',scrollY>60),{passive:true});

/* ---- glide-to-center detail (FLIP) ---- */
const scrim=document.getElementById('scrim'),detail=document.getElementById('detail');
function openDetail(card,p){
  document.getElementById('dimg').src=maxres(p.yt);
  document.getElementById('dimg').onerror=function(){this.onerror=null;this.src=hq(p.yt);};
  document.getElementById('dcode').textContent=p.c==="—"?"DIRECTOR REEL":p.c;
  document.getElementById('dtitle').textContent=p.t;
  document.getElementById('dmeta').innerHTML=
    `<div><div class="k">Client</div>${p.client}</div><div><div class="k">Type</div>${p.type}</div>`+
    `<div><div class="k">Year</div>${p.year}</div>`+(p.views?`<div><div class="k">Views</div>${p.views}</div>`:'');
  document.getElementById('dcase').style.display=p.dossier?'':'none';
  /* Freeze everything ambient behind the modal — the blurred scrim would
     otherwise keep resampling a moving background every frame for no
     visible benefit; the user is looking at the modal, not the wall. */
  modalOpen=true;
  clearInterval(htimer);
  if(activePreview)stopPreview(activePreview.card);
  scrim.classList.add('on');
  detail.classList.add('on');
  if(reduced||!card){detail.style.transform='translate(-50%,-50%)';return;}
  detail.style.transition='none';
  detail.style.transform='translate(-50%,-50%)';
  const dr=detail.getBoundingClientRect();
  const cr=card.getBoundingClientRect();
  const sx=cr.width/dr.width, sy=cr.height/dr.height;
  const tx=(cr.left+cr.width/2)-(dr.left+dr.width/2);
  const ty=(cr.top+cr.height/2)-(dr.top+dr.height/2);
  detail.style.transform=`translate(-50%,-50%) translate(${tx}px,${ty}px) scale(${sx},${sy})`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    detail.style.transition='transform .55s var(--ease-enter),opacity .3s';
    detail.style.transform='translate(-50%,-50%)';
  }));
}
function closeDetail(){
  scrim.classList.remove('on');
  detail.classList.remove('on');
  detail.style.transition='transform .4s var(--ease-settle),opacity .35s';
  detail.style.transform='translate(-50%,-50%) scale(.9)';
  modalOpen=false;
  rotate();
  kickMarquee();
}
document.getElementById('dclose').onclick=closeDetail;
document.getElementById('dplay').onclick=closeDetail;
document.getElementById('dcase').onclick=closeDetail;
scrim.onclick=closeDetail;
addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
</script>
</body>
